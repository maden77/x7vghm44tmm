name: Run C Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y gcc
    
    - name: Compile server
      run: |
        gcc -o server main.c -pthread
        ls -la server
    
    - name: Run server
      run: |
        ./server &
        sleep 2
    
    - name: Test server
      run: |
        curl -v http://localhost:3000